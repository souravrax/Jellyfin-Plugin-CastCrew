name: Build, test and publish CastCrew

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Determine plugin version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(dotnet msbuild src/Jellyfin.Plugin.CastCrew/Jellyfin.Plugin.CastCrew.csproj -nologo -getProperty:Version)"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build all supported server targets
        run: dotnet build src/Jellyfin.Plugin.CastCrew/Jellyfin.Plugin.CastCrew.csproj -c Release -p:Version=${{ steps.version.outputs.value }}
      - name: Run unit tests for all supported server targets
        run: dotnet test tests/Jellyfin.Plugin.CastCrew.Tests -c Release -p:Version=${{ steps.version.outputs.value }}
      - name: Run Jellyfin 12 container integration tests
        run: dotnet test tests/Jellyfin.Plugin.CastCrew.IntegrationTests -c Release -p:Version=${{ steps.version.outputs.value }}
      - name: Fetch previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          # A new fork has no published repository history yet.
          if gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/contents/manifest.json?ref=gh-pages" \
              -H 'Accept: application/vnd.github.raw+json' > artifacts/previous-manifest.json
          fi
      - name: Create packages and manifest
        run: python3 scripts/package_plugin.py --version '${{ steps.version.outputs.value }}' --repository '${{ github.repository }}' --existing artifacts/previous-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: castcrew-plugin-packages
          path: |
            artifacts/*.zip
            artifacts/manifest.json
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/manifest.json
      - name: Prepare raw plugin manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p pages
          cp artifacts/manifest.json pages/
      - name: Update raw manifest branch
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
